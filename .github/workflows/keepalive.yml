# free tiers pause when idle; /readyz queries the database, so one ping keeps both awake
name: Keep alive

on:
  schedule: [{ cron: "0 3 */2 * *" }]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL || secrets.BACKEND_URL }}
    steps:
      - name: Ping
        run: |
          [ -n "$API_URL" ] || { echo "API_URL not set - nothing to ping"; exit 0; }
          curl -fsS --retry 6 --retry-delay 30 --retry-all-errors --max-time 90 "$API_URL/readyz"
      - name: Open an issue if the API is down
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, labels: 'outage', state: 'open' });
            if (open.data.length === 0) await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title: 'API health check failing', labels: ['outage'],
              body: `The scheduled /readyz ping failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
