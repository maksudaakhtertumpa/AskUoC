[project]
name = "askuoc"
version = "0.1.0"
description = "RAG chatbot for the University of Cyberjaya (LangGraph, FastAPI, pgvector, Gemini)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maksuda Akther Tumpa" }]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
testpaths = ["backend/tests", "ingest/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E741", "B008", "B905", "UP037"]

[tool.ruff.lint.per-file-ignores]
"ingest/load.py" = ["E402"]
"eval/run_eval.py" = ["E402"]
